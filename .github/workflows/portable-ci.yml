name: Portable CI

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'wrapper/**'
      - '.mise.toml'
      - 'UPSTREAM'
      - '.github/workflows/portable-ci.yml'
      - '.github/workflows/portable-release.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/**'
      - 'wrapper/**'
      - '.mise.toml'
      - 'UPSTREAM'
      - '.github/workflows/portable-ci.yml'
      - '.github/workflows/portable-release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream release tag to build (empty = latest stable)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: portable-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build win-x64 portable ZIP
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Enable Git long paths
        shell: bash
        run: git config --global core.longpaths true

      - name: Resolve the upstream toolchain
        id: toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          bash wrapper/upstream-toolchain.sh "$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved for ${TAG:-(latest stable)}:"
          bash wrapper/upstream-toolchain.sh "$TAG"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.node }}

      # pnpm/action-setup@v6 has to stay: its successor (`pnpm/setup`) only
      # installs pnpm 11 and newer, while upstream tags pin 9.15.0 today and a
      # run can build tags that pin different majors.
      - uses: pnpm/action-setup@v6
        id: pnpm
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - uses: actions/setup-dotnet@v6
        id: dotnet
        continue-on-error: true
        with:
          dotnet-version: ${{ steps.toolchain.outputs.dotnet }}

      - uses: actions/setup-dotnet@v6
        if: steps.dotnet.outcome == 'failure'
        with:
          dotnet-version: ${{ steps.toolchain.outputs.dotnet }}

      # The runner image ships its own pnpm, so make sure the pin this run
      # resolved is the pnpm the build will actually call.
      - name: Verify the pnpm the tag pins
        shell: bash
        env:
          EXPECTED_PNPM: ${{ steps.toolchain.outputs.pnpm }}
          PNPM_BIN: ${{ steps.pnpm.outputs.bin_dest }}
        run: |
          set -euo pipefail
          if ! actual="$(pnpm --version)"; then
            echo "::error::pnpm is not on PATH; pnpm/action-setup put it in '${PNPM_BIN:-<unknown>}'."
            exit 1
          fi
          echo "node $(node --version), pnpm $actual (pinned ${EXPECTED_PNPM:-(none)})"
          if [ -n "${EXPECTED_PNPM:-}" ] && [ "${EXPECTED_PNPM%%.*}" != "${actual%%.*}" ]; then
            echo "::error::pnpm $actual is on PATH but the tag pins ${EXPECTED_PNPM}; a different major cannot read the lockfile."
            exit 1
          fi

      - name: Check scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check wrapper/build-portable.mjs
          node --check wrapper/latest-upstream-tag.mjs
          node --check wrapper/lib/toolchain-check.mjs
          node --check scripts/package-portable.mjs
          bash -n wrapper/lib/semver.sh
          bash -n wrapper/resolve-release.sh
          bash -n wrapper/publish-release.sh
          bash -n wrapper/upstream-toolchain.sh
          node wrapper/lib/toolchain-check.test.mjs

      - name: Check Scoop helpers (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in @('wrapper/scoop/scoop-register-protocol.ps1', 'wrapper/scoop/scoop-unregister-protocol.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Check Scoop helpers (PowerShell 7)
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('wrapper/scoop/scoop-register-protocol.ps1', 'wrapper/scoop/scoop-unregister-protocol.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Build portable ZIP
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${INPUT_TAG:-}" ]; then args+=(--tag "$INPUT_TAG"); fi
          node wrapper/build-portable.mjs "${args[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: astra-portable-ci
          # A wildcard after out/portable/ would nest every file under win-x64/.
          path: |
            out/portable/win-x64/*.zip
            out/portable/win-x64/*.sha256
            out/portable/win-x64/build-info.json
          if-no-files-found: error
          retention-days: 7
