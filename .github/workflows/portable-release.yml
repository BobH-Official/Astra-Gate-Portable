name: Portable release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream release tag (empty = latest stable)'
        required: false
        type: string
      rid:
        description: 'Windows RID to build (win-x64, win-arm64, or both)'
        required: true
        default: win-x64
        type: choice
        options:
          - win-x64
          - win-arm64
          - both
      force:
        description: 'Rebuild even if the release already contains the requested assets'
        required: false
        default: false
        type: boolean
      catch_up:
        description: 'Also build stable versions released since the newest published build (ignored when tag is set)'
        required: false
        default: false
        type: boolean
  schedule:
    # Poll upstream every four hours. GitHub may delay or drop a scheduled run,
    # so the next tick repairs whatever is still missing.
    - cron: '23 */4 * * *'

permissions:
  contents: read

# One run at a time: two runs would race on the same release assets.
concurrency:
  group: portable-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve upstream release
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.resolve.outputs.build_matrix }}
      release_matrix: ${{ steps.resolve.outputs.release_matrix }}
      latest_stable: ${{ steps.resolve.outputs.latest_stable }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve the tags and the missing RIDs
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          # A dispatch always sends `rid` because it has a default. A scheduled
          # run has no inputs, so it targets both RIDs; the release check then
          # narrows that down to the ones that are actually missing.
          INPUT_RID: ${{ inputs.rid || 'both' }}
          INPUT_FORCE: ${{ inputs.force }}
          # A gap between polls can hide several upstream versions. Scheduled
          # runs catch up on them; a dispatch opts in explicitly.
          INPUT_CATCH_UP: ${{ inputs.catch_up || github.event_name == 'schedule' }}
        run: bash wrapper/resolve-release.sh

  build:
    name: Build ${{ matrix.version }} ${{ matrix.rid }}
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    strategy:
      fail-fast: false
      # One entry per (version, RID) that is still missing from its release.
      matrix: ${{ fromJSON(needs.resolve.outputs.build_matrix) }}
    runs-on: ${{ matrix.rid == 'win-arm64' && 'windows-11-arm' || 'windows-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Enable Git long paths
        shell: bash
        run: git config --global core.longpaths true

      - name: Resolve the upstream toolchain
        id: toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          bash wrapper/upstream-toolchain.sh "$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved for $TAG:"
          bash wrapper/upstream-toolchain.sh "$TAG"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.node }}

      # pnpm/action-setup@v6 has to stay: its successor (`pnpm/setup`) only
      # installs pnpm 11 and newer, while upstream tags pin 9.15.0 today and a
      # run can build tags that pin different majors.
      - uses: pnpm/action-setup@v6
        id: pnpm
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - uses: actions/setup-dotnet@v6
        id: dotnet
        continue-on-error: true
        with:
          dotnet-version: ${{ steps.toolchain.outputs.dotnet }}

      - uses: actions/setup-dotnet@v6
        if: steps.dotnet.outcome == 'failure'
        with:
          dotnet-version: ${{ steps.toolchain.outputs.dotnet }}

      # The runner image ships its own pnpm and this matrix can build several
      # tags at once, so make sure the pin this entry resolved is the pnpm the
      # build will actually call, instead of discovering it after the clone.
      - name: Verify the pnpm the tag pins
        shell: bash
        env:
          EXPECTED_PNPM: ${{ steps.toolchain.outputs.pnpm }}
          PNPM_BIN: ${{ steps.pnpm.outputs.bin_dest }}
        run: |
          set -euo pipefail
          if ! actual="$(pnpm --version)"; then
            echo "::error::pnpm is not on PATH; pnpm/action-setup put it in '${PNPM_BIN:-<unknown>}'."
            exit 1
          fi
          echo "node $(node --version), pnpm $actual (pinned ${EXPECTED_PNPM:-(none)})"
          if [ -n "${EXPECTED_PNPM:-}" ] && [ "${EXPECTED_PNPM%%.*}" != "${actual%%.*}" ]; then
            echo "::error::pnpm $actual is on PATH but the tag pins ${EXPECTED_PNPM}; a different major cannot read the lockfile."
            exit 1
          fi

      - name: Check scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check wrapper/build-portable.mjs
          node --check wrapper/latest-upstream-tag.mjs
          node --check wrapper/lib/toolchain-check.mjs
          node --check scripts/package-portable.mjs
          bash -n wrapper/lib/semver.sh
          bash -n wrapper/resolve-release.sh
          bash -n wrapper/publish-release.sh
          bash -n wrapper/upstream-toolchain.sh
          node wrapper/lib/toolchain-check.test.mjs

      - name: Check Scoop helpers (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in @('wrapper/scoop/scoop-register-protocol.ps1', 'wrapper/scoop/scoop-unregister-protocol.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Check Scoop helpers (PowerShell 7)
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('wrapper/scoop/scoop-register-protocol.ps1', 'wrapper/scoop/scoop-unregister-protocol.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Build portable ZIP
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RID: ${{ matrix.rid }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          node wrapper/build-portable.mjs --tag "$TAG" --rid "$RID"

      - name: Name build info per RID
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(out/portable/*/build-info.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::The build did not produce build-info.json."
            exit 1
          fi
          for file in "${files[@]}"; do
            mv "$file" "${file%.json}-$RID.json"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: astra-portable-${{ matrix.version }}-${{ matrix.rid }}
          # The wildcard must come after the RID directory: upload-artifact keeps
          # the hierarchy below the first wildcard, so `out/portable/*/*.zip`
          # would nest every file under `win-x64/` and the release job would see
          # directories instead of a flat set of assets.
          path: |
            out/portable/${{ matrix.rid }}/*.zip
            out/portable/${{ matrix.rid }}/*.sha256
            out/portable/${{ matrix.rid }}/build-info-*.json
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish ${{ matrix.version }}
    needs: [resolve, build]
    # Publish whatever the matrix managed to build. A failed RID or version must
    # not throw away the others; the next run rebuilds the missing pieces
    # because the resolver only looks at the assets attached to the release.
    if: |
      always() &&
      needs.resolve.result == 'success' &&
      needs.resolve.outputs.skip != 'true'
    strategy:
      fail-fast: false
      # Serialise the uploads: the notes of one release are rebuilt from its own
      # assets, and concurrent `gh release create` calls would race.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.resolve.outputs.release_matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Only the RIDs that actually built for this version are downloaded, so a
      # partial matrix is not an error here.
      - name: Collect the build artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          # `-win-*` keeps a preview of the same version (0.14.3102-preview.1)
          # out of the stable release's asset set.
          pattern: astra-portable-${{ matrix.version }}-win-*
          path: dist
          merge-multiple: true

      - name: Check the collected artifacts
        id: artifacts
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(dist/*.zip)

          if [ ${#zips[@]} -eq 0 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            if [ "$BUILD_RESULT" = "success" ]; then
              echo "::error::The build matrix succeeded but produced no artifact for $VERSION."
              ls -la dist 2>/dev/null || true
              exit 1
            fi
            echo "::warning::Nothing to publish for $VERSION: the build matrix finished as '$BUILD_RESULT'."
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Publishing ${#zips[@]} ZIP asset(s) for $VERSION:"
          rids=""
          for zip in "${zips[@]}"; do
            name="${zip##*/}"
            echo "  $name"
            arch="${name#*win32-}"
            arch="${arch%-portable.zip}"
            case "$arch" in
              x64 | arm64) rids="${rids:+$rids }win-$arch" ;;
            esac
          done
          echo "rids=$rids" >> "$GITHUB_OUTPUT"
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::warning::The build matrix finished as '$BUILD_RESULT'; publishing the RIDs that succeeded for $VERSION."
          fi

      - name: Stage Scoop helpers
        if: steps.artifacts.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          helpers=(wrapper/scoop/*.ps1)
          if [ ${#helpers[@]} -eq 0 ]; then
            echo "::error::No Scoop helper scripts found in wrapper/scoop."
            exit 1
          fi
          cp "${helpers[@]}" dist/
          # Bare file names keep the published `.sha256` in the documented
          # `<sha256>  <filename>` form that Scoop's hash.url expects.
          ( cd dist && for file in *.ps1; do sha256sum "$file" > "$file.sha256"; done )

      - name: Publish the release
        if: steps.artifacts.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ matrix.tag }}
          VERSION: ${{ matrix.version }}
          LATEST_STABLE_TAG: ${{ needs.resolve.outputs.latest_stable }}
          BUILT_RIDS: ${{ steps.artifacts.outputs.rids }}
        run: bash wrapper/publish-release.sh
