name: Portable release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream release tag (empty = latest stable)'
        required: false
        type: string
      rid:
        description: 'Windows RID'
        required: true
        default: win-x64
        type: choice
        options:
          - win-x64
          - win-arm64
      force:
        description: 'Rebuild even if a portable release for this tag already exists'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: portable-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve upstream release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve the tag and check this repository
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_RID: ${{ github.event.inputs.rid || 'win-x64' }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          else
            tag=$(node wrapper/latest-upstream-tag.mjs)
          fi
          case "$tag" in
            v*) ;;
            *) tag="v$tag" ;;
          esac
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$ ]]; then
            echo "::error::Unsupported upstream tag: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          rid="${INPUT_RID:-win-x64}"
          case "$rid" in
            win-x64) arch=x64 ;;
            win-arm64) arch=arm64 ;;
            *)
              echo "::error::Unsupported rid: $rid"
              exit 1
              ;;
          esac
          asset="Astra-$version-win32-$arch-portable.zip"
          asset_sha="$asset.sha256"
          assets=""
          if [ "${INPUT_FORCE:-}" != "true" ]; then
            assets=$(gh release view "portable-$tag" --json assets --jq '.assets[].name' 2>/dev/null || true)
            if grep -Fxq "$asset" <<< "$assets" && grep -Fxq "$asset_sha" <<< "$assets"; then
              echo "Release portable-$tag already contains $asset and $asset_sha; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -n "$assets" ]; then
              echo "Release portable-$tag exists but is missing $asset or $asset_sha; rebuilding."
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ github.event.inputs.rid || 'win-x64' }}
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ${{ github.event.inputs.rid == 'win-arm64' && 'windows-11-arm' || 'windows-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Enable Git long paths
        shell: bash
        run: git config --global core.longpaths true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-dotnet@v4
        id: dotnet
        continue-on-error: true
        with:
          dotnet-version: 11.0.100-rc.3.26522.148

      - uses: actions/setup-dotnet@v4
        if: steps.dotnet.outcome == 'failure'
        with:
          dotnet-version: 11.0.100-rc.3.26522.148

      - name: Check scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check wrapper/build-portable.mjs
          node --check wrapper/latest-upstream-tag.mjs
          node --check scripts/package-portable.mjs

      - name: Check Scoop helpers (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in @('wrapper/scoop/scoop-register-protocol.ps1', 'wrapper/scoop/scoop-unregister-protocol.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Check Scoop helpers (PowerShell 7)
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('wrapper/scoop/scoop-register-protocol.ps1', 'wrapper/scoop/scoop-unregister-protocol.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Build portable ZIP
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RID: ${{ github.event.inputs.rid || 'win-x64' }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          node wrapper/build-portable.mjs --tag "$TAG" --rid "$RID"

      - uses: actions/upload-artifact@v4
        with:
          name: astra-portable-${{ needs.resolve.outputs.version }}-${{ github.event.inputs.rid || 'win-x64' }}
          path: |
            out/portable/*/*.zip
            out/portable/*/*.sha256
            out/portable/*/build-info.json
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the portable release
    needs: [resolve, build]
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: astra-portable-${{ needs.resolve.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Stage Scoop helpers
        shell: bash
        run: |
          set -euo pipefail
          cp wrapper/scoop/*.ps1 dist/
          cd dist
          for file in *.ps1; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Verify the SHA-256 asset
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c ./*.sha256

      - name: Create or update the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          release_tag="portable-$TAG"
          title="Astra Gate portable $VERSION (unofficial)"
          notes=$(mktemp)
          {
            echo "Unofficial Windows portable build of Astra Gate $TAG."
            echo
            echo "- Upstream release: https://github.com/$(cat UPSTREAM)/releases/tag/$TAG"
            echo "- Build run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Wrapper commit: ${{ github.sha }}"
            echo "- Assets: unpack-and-run ZIP and its SHA-256. No installer and no admin rights."
            echo "- Scoop Notes helpers: scoop-register-protocol.ps1 and scoop-unregister-protocol.ps1 (with .sha256)."
            for zip in dist/*.zip; do
              base=$(basename "$zip")
              echo "- $base SHA-256: $(sha256sum "$zip" | awk '{print $1}')"
              echo "  Scoop hash.url: ${{ github.server_url }}/${{ github.repository }}/releases/download/$release_tag/${base}.sha256"
            done
            echo "- Not affiliated with the upstream project. Report portable-build issues in this repository."
          } > "$notes"
          flags=()
          if [[ "$VERSION" == *-preview.* ]]; then flags=(--prerelease); fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release edit "$release_tag" --title "$title" --notes-file "$notes" "${flags[@]}"
            gh release upload "$release_tag" dist/* --clobber
          else
            gh release create "$release_tag" dist/* --target "$GITHUB_SHA" --title "$title" --notes-file "$notes" "${flags[@]}"
          fi
